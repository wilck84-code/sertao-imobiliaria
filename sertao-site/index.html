<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sertão Imobiliária</title>
<meta name="description" content="Casas para alugar e comprar. Veja as fotos e marque sua visita pelo WhatsApp.">
<meta property="og:title" content="Sertão Imobiliária">
<meta property="og:description" content="Casas para alugar e comprar. Veja as fotos e marque sua visita pelo WhatsApp.">
<meta name="theme-color" content="#1B3D75">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Sertão">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: site de catálogo — abas Comprar/Alugar, grade de cartões com foto e botão de visita; ficha com galeria; painel do corretor em /#admin */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16213A; --muted:#59647A; --line:#D9DFEA;
  --accent:#1B3D75; --accent-ink:#FFFFFF; --sun:#C8383C; --sun-ink:#FFFFFF; --logo-bg:transparent;
  --chip:#E5EAF3; --wa:#1A9B4F; --wa-ink:#FFFFFF; --warn:#9A6400; --warn-bg:#FBF0D9; --bad:#B23A2E;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 20px rgba(20,40,30,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2E; --ink:#E6EAF2; --muted:#9AA5BC; --line:#283146;
  --accent:#7FA6EE; --accent-ink:#0B1222; --sun:#F07A72; --sun-ink:#1A0A0A; --chip:#1F2840; --logo-bg:#FFFFFF;
  --wa:#25B860; --wa-ink:#06120A; --warn:#F0C060; --warn-bg:#3A2E14; --bad:#F08A7E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2E; --ink:#E6EAF2; --muted:#9AA5BC; --line:#283146;
  --accent:#7FA6EE; --accent-ink:#0B1222; --sun:#F07A72; --sun-ink:#1A0A0A; --chip:#1F2840; --logo-bg:#FFFFFF;
  --wa:#25B860; --wa-ink:#06120A; --warn:#F0C060; --warn-bg:#3A2E14; --bad:#F08A7E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.logo svg{width:32px;height:32px}
.logo-img{height:50px;width:auto;max-width:180px;object-fit:contain;display:block;background:var(--logo-bg);border-radius:8px;padding:2px 4px}
.marca-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.marca-prev{width:140px;height:90px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:#FFFFFF;padding:8px;flex:0 0 auto}
.marca-prev .logo-img{max-height:70px;height:auto;max-width:100%}
.marca-prev svg{width:52px;height:52px}
.tabs{margin-left:auto;display:flex;background:var(--chip);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.owner-btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);font:700 13px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.owner-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.intro{padding-block:28px 8px}
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0 0 6px;text-wrap:balance;letter-spacing:-.02em}
.intro p{margin:0;color:var(--muted);max-width:62ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:16px}
.filters select{font:500 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:auto}
.count{color:var(--muted);font-size:13px;align-self:center;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card-open{border:0;padding:0;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;flex:1}
.card-wa{margin:0 16px 16px;width:auto}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--chip);overflow:hidden}
.ph svg,.ph img{display:block;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;left:10px;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:var(--surface);color:var(--ink)}
.nphotos{position:absolute;bottom:10px;right:10px;font:600 12px var(--body);padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff}
.cbody{padding:14px 16px 12px;display:grid;gap:6px;width:100%}
.price{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.price small{font:500 13px var(--body);color:var(--muted)}
.ttl{font-weight:600}
.loc{color:var(--muted);font-size:13px}
.pin{color:var(--accent);font-weight:600}
.specs{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.specs b{color:var(--ink);font-weight:700}
.empty{padding:40px 0;color:var(--muted);text-align:center}
footer{color:var(--muted);font-size:13px;padding-top:32px}

/* Ficha */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.55);display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:760px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:900px;max-height:100%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:760px){.sheet{border-radius:20px;max-height:92vh}}
.gal{position:relative;background:#000;aspect-ratio:16/10;max-width:100%}
.gal svg{width:100%;height:100%;display:block}
.gal img{width:100%;height:100%;display:block;object-fit:contain}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#18261F;font-size:22px;cursor:pointer;display:grid;place-items:center}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .close{position:absolute;top:10px;right:10px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:7px 14px;font:600 13px var(--body);cursor:pointer}
.gal .room{position:absolute;bottom:10px;left:10px;font:600 12px var(--body);color:#fff;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px}
.thumbs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.thumbs button{flex:0 0 84px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--chip)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs svg,.thumbs img{width:100%;height:100%;display:block;object-fit:cover}
.info{padding:8px 20px 24px;display:grid;gap:20px}
@media(min-width:760px){.info{grid-template-columns:1fr 300px;align-items:start}}
.info > *{min-width:0}
.info h2{font-family:var(--display);font-size:24px;font-weight:800;margin:4px 0;letter-spacing:-.01em;text-wrap:balance}
.code{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.facts div{background:var(--chip);border-radius:10px;padding:10px 4px;text-align:center}
.facts b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
.desc{max-width:62ch;margin:0;white-space:pre-line}
.extras{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding:0;list-style:none}
.extras li{font-size:12px;background:var(--chip);border-radius:999px;padding:4px 10px}
.gps{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gps-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--chip)}
.gps-head svg{flex:0 0 36px;width:36px;height:36px}
.gps-head > div{min-width:0;flex:1}
.gps-head b{display:block;font-size:14px}
.coords{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;user-select:all}
.gps-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.gps-btns a{background:var(--surface);color:var(--accent);text-decoration:none;text-align:center;font:700 13px var(--body);padding:11px 6px}
.gps-btns a:hover{background:var(--chip)}
.visit{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.visit h3{margin:0;font-family:var(--display);font-size:19px;font-weight:800}
@media(min-width:760px){.visit{position:sticky;top:12px}}

/* botões e campos */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;border:0;border-radius:12px;padding:13px 16px;font:700 15px var(--body);cursor:pointer;text-decoration:none;width:100%}
.btn svg{width:20px;height:20px;flex:0 0 20px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 12px var(--body);cursor:pointer;text-decoration:none;display:inline-block}
.mini.danger{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--bad);font-size:13px;margin:0;font-weight:600}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:0}
input,select,textarea{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical}
.hint{font-weight:500;color:var(--muted);font-size:12px}

/* Meus imóveis */
.admin-top{display:grid;gap:12px;padding-top:12px}
@media(min-width:760px){.admin-top{grid-template-columns:auto 1fr;align-items:end}}
.wa-set{display:flex;gap:8px;align-items:end;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.wa-set label{flex:1 1 220px}
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;margin-top:18px}
.panel h2{margin:0;font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.g2.stack{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--muted);font:700 14px var(--body);padding:9px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--chip)}
.drop b{font-size:15px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.foto{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);display:grid}
.foto .im{position:relative;aspect-ratio:4/3;background:var(--chip)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .capa{position:absolute;top:6px;left:6px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:5px}
.foto .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.foto input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13px;padding:7px 8px}
.foto .acts{display:flex;border-top:1px solid var(--line)}
.foto .acts button{flex:1;border:0;background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:7px 0;cursor:pointer}
.foto .acts button+button{border-left:1px solid var(--line)}
.foto .acts button.danger{color:var(--bad)}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.check input{width:20px;height:20px}
.form-acts{display:flex;gap:10px;flex-wrap:wrap}
.form-acts .btn{width:auto;flex:1 1 180px}
.alist{display:grid;gap:10px;margin-top:12px}
.st-resumo{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.arow.fora .th{opacity:.55}
.pill.done{background:var(--chip);color:var(--muted)}
.mini.primary-mini{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.arow{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px;align-items:center}
.arow .th{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--chip)}
.arow .th img,.arow .th svg{width:100%;height:100%;object-fit:cover;display:block}
.arow .m{min-width:0;display:grid;gap:3px}
.arow .t{font-weight:700;overflow-wrap:anywhere}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pill{display:inline-block;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;vertical-align:middle}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill.off{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

/* Painel: abas, acessos */
.login{max-width:420px;margin:40px auto 0}
.abas{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:12px}
.abas button{border:0;background:none;color:var(--muted);font:700 14px var(--body);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.abas .sair{margin-left:auto;color:var(--sun)}
.admin-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:16px}
.st-resumo{display:flex;gap:6px;flex-wrap:wrap}
.per{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;margin-top:16px;flex-wrap:wrap}
.per button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.per button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{font-size:12px;color:var(--muted)}
.dias14{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;height:150px;align-items:end}
.dcol{display:grid;grid-template-rows:18px 1fr 18px;height:100%;text-align:center;min-width:0}
.dcol .dv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dcol i{display:block;align-self:end;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.dcol .dl{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabela{overflow-x:auto}
.tabela table{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tabela td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tabela .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tabela tr.fora td{color:var(--muted)}
.tc{display:grid;gap:3px;min-width:0}
.meter{display:block;height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:3px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const API = "/api";
let CFG = { nome: "Sertão Imobiliária", whatsapp: "", logo: "/logo.png", mostrarNome: false };
let IMOVEIS = [];
const TIPOS = ["Casa","Apartamento","Casa duplex","Kitnet","Chácara","Terreno","Sala comercial","Ponto comercial"];
const COMODOS = ["Fachada","Sala","Quarto","Cozinha","Banheiro"];
const COR_PADRAO = ["#E9E4D8","#4E6B5A"];
const ROT = {disponivel:"Disponível",alugado:"Alugado",vendido:"Vendido",pausado:"Pausado"};
const ROT_PL = {disponivel:"disponíveis",alugado:"alugados",vendido:"vendidos",pausado:"pausados"};
const ROT_SG = {disponivel:"disponível",alugado:"alugado",vendido:"vendido",pausado:"pausado"};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const num = v => { const d=String(v??"").replace(/\D/g,""); return d?parseInt(d,10):0; };
const fmtN = n => Number(n||0).toLocaleString("pt-BR");
function waNum(t){ let d=String(t||"").replace(/\D/g,""); if(d.length===10||d.length===11) d="55"+d; return d; }
function fmtTel(t){ let d=String(t||"").replace(/\D/g,""); if(d.startsWith("55")&&d.length>11) d=d.slice(2);
  if(d.length===11) return `(${d.slice(0,2)}) ${d[2]} ${d.slice(3,7)}-${d.slice(7)}`;
  if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return t||""; }
const waLink = (n,msg) => `https://wa.me/${waNum(n)}?text=${encodeURIComponent(msg)}`;
function gps(im){
  if(!im||!im.gps) return null;
  const p=String(im.gps).split(/[,;\s]+/).filter(Boolean).map(Number);
  if(p.length<2||p.some(isNaN)||Math.abs(p[0])>90||Math.abs(p[1])>180) return null;
  const c=p[0]+","+p[1];
  return {txt:p[0]+", "+p[1], mapa:"https://www.google.com/maps?q="+c,
    rota:"https://www.google.com/maps/dir/?api=1&destination="+c, waze:"https://waze.com/ul?ll="+c+"&navigate=yes"};
}

/* Contador: cada pessoa conta uma vez por dia em cada casa */
function registrar(tipo,id){
  if(location.hash==="#admin"||ls.get("st-senha")) return; // não conta o próprio corretor
  const k=`st-ev-${tipo}-${id||"_"}-${hojeISO()}`;

/* ---------- ilustrações para imóveis sem foto ---------- */
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=c=>Math.max(0,Math.min(255,Math.round(c+(p<0?c:255-c)*p)));return "#"+[f(n>>16),f(n>>8&255),f(n&255)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function desenho(im,k){

    <rect x="190" y="170" width="40" height="65" fill="${shade(roof,-.2)}"/><circle cx="222" cy="205" r="3" fill="#F0B73E"/>
    <rect x="115" y="172" width="55" height="40" fill="#BFDDEB" stroke="#fff" stroke-width="4"/>
    <rect x="250" y="172" width="55" height="40" fill="#BFDDEB" stroke="#fff" stroke-width="4"/>
    ${(im.extras||[]).includes("Piscina")?`<rect x="300" y="255" width="90" height="30" rx="6" fill="#5EC3E3"/>`:""}
    <rect x="345" y="205" width="4" height="30" fill="#6B4B2E"/><circle cx="347" cy="200" r="16" fill="#5C9A52"/></svg>`;
  }
  const floor=shade(wall,-.35), w2=shade(wall,.25);
  if(k===1) return `<svg ${vb}><rect width="400" height="300" fill="${w2}"/><rect y="215" width="400" height="85" fill="${floor}"/>
    <rect x="230" y="50" width="120" height="100" fill="#BFDDEB" stroke="#fff" stroke-width="6"/><line x1="290" y1="50" x2="290" y2="150" stroke="#fff" stroke-width="4"/>
    <rect x="40" y="160" width="170" height="60" rx="10" fill="${roof}"/><rect x="40" y="140" width="170" height="35" rx="10" fill="${shade(roof,.15)}"/>
    <rect x="245" y="200" width="90" height="10" rx="3" fill="#6B4B2E"/><rect x="255" y="208" width="6" height="22" fill="#6B4B2E"/><rect x="320" y="208" width="6" height="22" fill="#6B4B2E"/>
    <rect x="360" y="185" width="22" height="35" fill="#B7864C"/><circle cx="371" cy="170" r="22" fill="#4F8A4A"/>
    <rect x="70" y="70" width="70" height="50" fill="${shade(roof,.4)}" stroke="#fff" stroke-width="3"/></svg>`;
  if(k===2) return `<svg ${vb}><rect width="400" height="300" fill="${w2}"/><rect y="220" width="400" height="80" fill="${floor}"/>
    <rect x="90" y="120" width="220" height="40" rx="6" fill="${shade(roof,-.1)}"/><rect x="80" y="155" width="240" height="70" rx="8" fill="#FBFBF7"/>
    <rect x="80" y="175" width="240" height="50" rx="8" fill="${roof}"/><rect x="105" y="140" width="70" height="25" rx="8" fill="#fff"/><rect x="225" y="140" width="70" height="25" rx="8" fill="#fff"/>
    <rect x="330" y="185" width="45" height="40" fill="#8A6A45"/><circle cx="352" cy="170" r="10" fill="#F0B73E"/>
    <rect x="20" y="60" width="50" height="160" fill="${shade(wall,-.1)}"/></svg>`;
  if(k===3) return `<svg ${vb}><rect width="400" height="300" fill="#F4F2EC"/><rect y="230" width="400" height="70" fill="${floor}"/>
    <rect x="30" y="40" width="340" height="60" fill="${roof}"/><line x1="143" y1="40" x2="143" y2="100" stroke="#fff" stroke-width="2"/><line x1="256" y1="40" x2="256" y2="100" stroke="#fff" stroke-width="2"/>
    <rect x="30" y="150" width="340" height="80" fill="${roof}"/><rect x="25" y="145" width="350" height="10" fill="#D8D4CA"/>

function fotosDe(im){
  if(im.fotos&&im.fotos.length) return im.fotos.map((f,i)=>({html:`<img src="${esc(f.src)}" alt="${esc(f.nome||im.titulo)}" ${i?'loading="lazy"':""}>`, nome:f.nome||("Foto "+(i+1))}));

  if(!carregado) return;

  const l=IMOVEIS.filter(i=>i.modo===modo&&(!b||i.bairro===b)&&i.q>=q).sort((x,y)=>o==="menor"?x.preco-y.preco:y.preco-x.preco);

function showFoto(){
  $("#big").innerHTML=FS[idx].html;

function fechar(){ $("#overlay").hidden=true; document.body.style.overflow=""; if(location.hash&&location.hash!=="#admin") history.replaceState(null,"",location.pathname); lastFocus&&lastFocus.focus&&lastFocus.focus(); }
$("#overlay").onclick=e=>{ if(e.target.id==="overlay") fechar(); };
document.addEventListener("keydown",e=>{
  if($("#overlay").hidden) return;
  if(e.key==="Escape") fechar();

});
function copiar(txt,btn,ok){
  const done=()=>{ btn.textContent="Copiado"; if(ok) toast(ok); };
  try{ navigator.clipboard.writeText(txt).then(done,()=>toast(txt)); }catch(e){ toast(txt); }
}

/* ---------- painel do administrador (seusite/#admin) ---------- */
let SENHA=ls.get("st-senha"), ADM=null, aba="imoveis", periodo=30, F=null, enviando=0;
async function api(caminho,opt={}){
  const r=await fetch(API+caminho,{...opt,headers:{...(opt.headers||{}),"x-senha":SENHA||""}});
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error(d.erro||"Erro "+r.status); err.status=r.status; throw err; }
  return d;
}
async function recarregarAdm(){ ADM=await api("/admin"); CFG=ADM.config; renderMarca(); }

/* contagem por período */
function somar(st,tipo,dias){
  if(!st) return 0;
  if(!dias) return (st.total&&st.total[tipo])||0;
  const ini=new Date(); ini.setDate(ini.getDate()-dias+1); const lim=isoLocal(ini);
  return Object.entries(st.dias||{}).reduce((s,[d,v])=>d>=lim?s+(v[tipo]||0):s,0);
}

function carregarImg(file){
  return new Promise((ok,erro)=>{ const u=URL.createObjectURL(file), i=new Image();
    i.onload=()=>{ ok(i); setTimeout(()=>URL.revokeObjectURL(u),1000); }; i.onerror=()=>erro(new Error("Não consegui abrir a imagem "+file.name+".")); i.src=u; });
}
async function enviarImagem(file,max,tipo,q){
  const img=await carregarImg(file);
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,tipo,q));
  const d=await api("/admin/foto",{method:"POST",headers:{"content-type":tipo},body:blob});
  return d.url;
}
async function adicionarFotos(files){
  if(!files.length) return;
  const alvo=F;
  for(const file of files){
    const slot={src:"",nome:""}; alvo.fotos.push(slot); enviando++; renderFotos();
    try{ slot.src=await enviarImagem(file,1600,"image/jpeg",.82); }
    catch(e){ alvo.fotos.splice(alvo.fotos.indexOf(slot),1); toast(e.message||"Não consegui enviar a foto."); }
    enviando--; if(F===alvo) renderFotos();
  }
}

    const im=IMOVEIS.find(i=>i.id===h);
    if(im){ if(im.modo!==modo) setModo(im.modo); if(atual!==im||$("#overlay").hidden) abrir(im.id); }
    else toast("Este imóvel não está mais disponível. Veja as outras opções.");
  }
}
window.addEventListener("hashchange",rota);

let inicial="aluguel"; try{ inicial=localStorage.getItem("st-modo")||"aluguel"; }catch(e){}
setModo(inicial); renderMarca();
if(SENHA) $("#btn-admin").hidden=false;
carregarPublico().then(()=>{ registrar("site"); rota(); });
